# ---- 1) Al nivel http{} (o arriba del server{} en el sites-available) ----
upstream ping_svc {
    server 127.0.0.1:8001;
    keepalive 32;
}

# ---- 2) Dentro del server { listen 443 ssl; ... } existente ----
# Ruta A/B: permite medir el microservicio en las MISMAS condiciones
# (mismo Nginx, mismo TLS) sin tocar la ruta original /ping/.
location /svc/ping/ {
    rewrite ^/svc/(.*)$ /$1 break;
    proxy_pass http://ping_svc;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

